<div class="panel h-full flex flex-col">
  <div class="panel-section">
    <div class="section-title">Elements</div>
    <div class="text-xs text-slate-500 mb-2">{{ elements.length }} item(s)</div>
  </div>

  <div class="flex-1 overflow-y-auto p-2 space-y-1">
    <div *ngIf="elements.length === 0" class="text-center py-8">
      <svg class="w-10 h-10 mx-auto text-slate-700 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
      </svg>
      <div class="text-xs text-slate-600">No elements yet</div>
      <div class="text-xs text-slate-700">Click + buttons above to add</div>
    </div>

    <div *ngFor="let el of elements; let i = index"
         [class]="el.id === selectedId ? 'layer-item-active' : 'layer-item'"
         (click)="selectElement(el.id)">
      <span class="w-6 h-6 rounded bg-slate-700/50 flex items-center justify-center text-xs font-mono text-slate-400 flex-shrink-0">
        {{ getTypeIcon(el.type) }}
      </span>
      <span class="flex-1 truncate text-sm">{{ el.name }}</span>
      <div class="flex items-center gap-0.5 opacity-0 group-hover:opacity-100" style="opacity: 0.5;">
        <button class="btn-icon p-0.5" (click)="moveUp(el.id, $event)" title="Move Up">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
        </button>
        <button class="btn-icon p-0.5" (click)="moveDown(el.id, $event)" title="Move Down">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <button class="btn-icon p-0.5 text-red-400 hover:text-red-300" (click)="deleteElement(el.id, $event)" title="Delete">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
