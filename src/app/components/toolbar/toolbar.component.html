<div class="h-14 bg-slate-900/80 backdrop-blur-xl border-b border-slate-700/50 flex items-center px-4 gap-3">
  <div class="flex items-center gap-2 mr-2">
    <div class="w-7 h-7 rounded-lg bg-indigo-500 flex items-center justify-center">
      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
      </svg>
    </div>
    <span class="text-sm font-semibold text-white tracking-tight">Label Designer</span>
  </div>

  <div class="h-6 w-px bg-slate-700/50"></div>

  <div class="flex items-center gap-2">
    <label class="label-text">W</label>
    <input type="number" [value]="labelWidth" (change)="onWidthChange(+$any($event.target).value)"
           class="input-field w-16 text-center" min="5">
    <label class="label-text">H</label>
    <input type="number" [value]="labelHeight" (change)="onHeightChange(+$any($event.target).value)"
           class="input-field w-16 text-center" min="5">
    <span class="text-xs text-slate-500">mm</span>
  </div>

  <div class="h-6 w-px bg-slate-700/50"></div>

  <div class="flex items-center gap-2">
    <label class="label-text">Rotate</label>
    <select [value]="orientation" (change)="onOrientationChange(+$any($event.target).value)" class="select-field w-28">
      <option *ngFor="let o of orientationOptions" [value]="o.value">{{ o.label }}</option>
    </select>
  </div>

  <div class="h-6 w-px bg-slate-700/50"></div>

  <div class="flex items-center gap-1.5">
    <button class="element-btn" (click)="addElement('text')" title="Add Text">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
      <span>Text</span>
    </button>
    <button class="element-btn" (click)="addElement('qrcode')" title="Add QR Code">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
      <span>QR</span>
    </button>
    <button class="element-btn" (click)="addElement('barcode')" title="Add Barcode">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h2v16H3V4zm4 0h1v16H7V4zm3 0h2v16h-2V4zm4 0h1v16h-1V4zm3 0h2v16h-2V4z"/></svg>
      <span>Barcode</span>
    </button>
    <button class="element-btn" (click)="addElement('image')" title="Add Image">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span>Image</span>
    </button>
    <button class="element-btn" (click)="addElement('rectangle')" title="Add Rectangle">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1" stroke-width="2"/></svg>
      <span>Rect</span>
    </button>
    <button class="element-btn" (click)="addElement('ellipse')" title="Add Ellipse">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7" stroke-width="2"/></svg>
      <span>Ellipse</span>
    </button>
    <button class="element-btn" (click)="addElement('circle')" title="Add Circle">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>
      <span>Circle</span>
    </button>
    <button class="element-btn" (click)="addElement('line')" title="Add Line">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 20L20 4"/></svg>
      <span>Line</span>
    </button>
  </div>

  <div class="flex-1"></div>

  <div class="flex items-center gap-2">
    <button class="btn-secondary" (click)="undo()" title="Undo">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
      </svg>
    </button>

    <!-- 新增 Redo 按鈕 -->
    <button class="btn-secondary" (click)="redo()" title="Redo">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"/>
      </svg>
    </button>
    <button class="btn-secondary" (click)="saveDesign()" title="Save Design">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
      Save
    </button>
    <button class="btn-secondary" (click)="loadDesign()" title="Load Design">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
      Load
    </button>
    <button class="btn-danger" (click)="clearAll()" title="Clear All">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      Clear
    </button>
  </div>
</div>
