<div class="bg-slate-900/90 backdrop-blur-xl border-t border-slate-700/50 h-full flex flex-col">
  <div class="flex items-center justify-between px-3 py-1.5">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <span [class]="printerAvailable ? 'status-dot-online' : 'status-dot-offline'"></span>
        <span class="text-xs font-medium" [class]="printerAvailable ? 'text-emerald-400' : 'text-red-400'">
          {{ printerAvailable ? 'Connected' : 'No Printer' }}
        </span>
      </div>
      <div class="h-3 w-px bg-slate-700/50"></div>
      <span class="text-xs text-slate-500">
        {{ elements.length }} elements | {{ labelWidth }}x{{ labelHeight }}mm
      </span>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-2 mr-1 pr-3 border-r border-slate-700/50">
        <label class="text-[10px] text-slate-400 uppercase tracking-wider font-medium">Copies</label>
        <input type="number"
               class="input-field text-xs py-1 px-2 w-14 text-center bg-slate-800/80 border-slate-600/50"
               [(ngModel)]="settings.copies"
               [disabled]="!printerAvailable"
               min="1" max="99">
      </div>
      <button class="btn-primary text-xs px-3 py-1" (click)="print()" [disabled]="!printerAvailable">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Print
      </button>
      <button class="btn-secondary text-xs px-3 py-1" (click)="preview()" [disabled]="!printerAvailable">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        Preview
      </button>
    </div>
  </div>

  <div class="border-t border-slate-700/30 flex-1 flex flex-col overflow-hidden">
    <div class="grid grid-cols-4 gap-0 divide-x divide-slate-700/30 flex-1">
      <div class="p-3 space-y-2">
        <!-- 標題與設定按鈕水平排列 -->
        <div class="flex items-center justify-between mb-1">
          <div class="section-title mb-0">Printer</div>
          <button class="text-indigo-400 hover:text-indigo-300 text-[10px] flex items-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                  (click)="showProperty()"
                  [disabled]="!printerAvailable"
                  title="開啟印表機系統設定">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            設定
          </button>
        </div>
        <select class="select-field text-xs" [value]="selectedPrinter" ...>
                [disabled]="!printerAvailable">
          <option *ngFor="let p of printers" [value]="getPrinterDisplayName(p)">{{ getPrinterDisplayName(p) }}</option>
        </select>
        <div class="grid grid-cols-2 gap-1.5">
          <div>
            <label class="label-text text-[10px]">Paper</label>
            <select class="select-field text-xs mt-0.5" [(ngModel)]="settings.gapType" (ngModelChange)="saveSettingsToDesign()" [disabled]="!printerAvailable">
              <option *ngFor="let o of gapTypeOptions" [ngValue]="o.value">{{ o.label }}</option>
            </select>
          </div>
          <div>
            <label class="label-text text-[10px]">Speed</label>
            <select class="select-field text-xs mt-0.5" [(ngModel)]="settings.printSpeed" (ngModelChange)="saveSettingsToDesign()" [disabled]="!printerAvailable">
              <option *ngFor="let o of printSpeedOptions" [ngValue]="o.value">{{ o.label }}</option>
            </select>
          </div>
          <div>
            <label class="label-text text-[10px]">Darkness</label>
            <select class="select-field text-xs mt-0.5" [(ngModel)]="settings.printDarkness" (ngModelChange)="saveSettingsToDesign()" [disabled]="!printerAvailable">
              <option *ngFor="let o of printDarknessOptions" [ngValue]="o.value">{{ o.label }}</option>
            </select>
          </div>
          <div>
            <label class="label-text text-[10px]">Rotate</label>
            <select class="select-field text-xs mt-0.5" [(ngModel)]="settings.orientation" (ngModelChange)="saveSettingsToDesign()" [disabled]="!printerAvailable">
              <option *ngFor="let o of orientationOptions" [ngValue]="o.value">{{ o.label }}</option>
            </select>
          </div>

        </div>
      </div>

      <div class="p-3 space-y-2">
        <div class="section-title">Operations</div>
        <!--<div class="flex flex-wrap gap-1">
          <button class="btn-success text-[10px] px-2 py-0.5" (click)="openPrinter()" [disabled]="!printerAvailable">Open</button>
          <button class="btn-secondary text-[10px] px-2 py-0.5" (click)="closePrinter()" [disabled]="!printerAvailable">Close</button>
          <button class="btn-secondary text-[10px] px-2 py-0.5" (click)="isPrinterOpened()" [disabled]="!printerAvailable">Status</button>
          <button class="btn-secondary text-[10px] px-2 py-0.5" (click)="getPrinterName()" [disabled]="!printerAvailable">Name</button>
          <button class="btn-secondary text-[10px] px-2 py-0.5" (click)="getPrinterDPI()" [disabled]="!printerAvailable">DPI</button>
          <button class="btn-secondary text-[10px] px-2 py-0.5" (click)="showProperty()" [disabled]="!printerAvailable">Props</button>
        </div>-->
        <div class="grid grid-cols-2 gap-1.5">
          <div>
            <label class="label-text text-[10px]">Mode</label>
            <select class="select-field text-xs mt-0.5" [(ngModel)]="settings.printMode" (ngModelChange)="saveSettingsToDesign()" [disabled]="!printerAvailable">
              <option *ngFor="let o of printModeOptions" [ngValue]="o.value">{{ o.label }}</option>
            </select>
          </div>
          <div>
            <label class="label-text text-[10px]">DPI</label>
            <select class="select-field text-xs mt-0.5" [(ngModel)]="settings.printerDpi" (ngModelChange)="saveSettingsToDesign()" [disabled]="!printerAvailable">
              <option *ngFor="let o of dpiOptions" [ngValue]="o.value">{{ o.label }}</option>
            </select>
          </div>
        </div>
        <div class="mt-2">
          <label class="label-text text-[10px]">Job Name</label>
          <input type="text" class="input-field text-xs mt-0.5 py-0.5"
                 [(ngModel)]="settings.jobName"
                 [disabled]="!printerAvailable"
                 placeholder="例如: 出貨單-01">
        </div>
      </div>

      <div class="col-span-2 p-3 space-y-2 flex flex-col">
        <div class="flex items-center justify-between">
          <div class="section-title mb-0">Preview</div>
          <button *ngIf="previewImages.length" class="btn-icon text-[10px] px-1 py-0.5" (click)="clearPreview()">Clear</button>
        </div>
        <div class="flex-1 bg-slate-950/50 rounded-lg p-2 flex items-center justify-center">
          <div *ngIf="previewImages.length === 0" class="text-center">
            <div class="text-xs text-slate-600">No preview yet</div>
            <div class="text-[10px] text-slate-700 mt-1">Click Preview to generate</div>
          </div>
          <div *ngFor="let img of previewImages" class="flex items-center justify-center">
            <img [src]="img" class="max-w-full max-h-full rounded border border-slate-700/50" alt="Preview">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
