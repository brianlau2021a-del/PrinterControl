<div class="h-screen flex flex-col overflow-hidden">
  <app-toolbar></app-toolbar>

  <div class="flex-1 flex overflow-hidden">
    <div [style.width.px]="leftPanelWidth" class="flex-shrink-0 p-2 pr-1">
      <app-element-panel></app-element-panel>
    </div>

    <div class="flex-1 flex items-center justify-center p-2">
      <app-canvas></app-canvas>
    </div>

    <div [style.width.px]="rightPanelWidth" class="flex-shrink-0 p-2 pl-1">
      <app-properties-panel></app-properties-panel>
    </div>
  </div>

  <div class="h-1 bg-slate-800 hover:bg-indigo-500/50 cursor-row-resize flex items-center justify-center group"
       (mousedown)="startResizeBottom($event)">
    <div class="h-0.5 w-8 bg-slate-600 group-hover:bg-indigo-400 rounded"></div>
  </div>

  <div [style.height.px]="bottomPanelHeight">
    <app-print-panel></app-print-panel>
  </div>
</div>
