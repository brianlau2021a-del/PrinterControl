<div class="panel h-full flex flex-col">
  <div class="panel-section flex items-center justify-between">
    <div class="section-title mb-0">Properties</div>
    <button *ngIf="selectedElement" class="btn-danger text-xs px-2 py-1" (click)="deleteSelected()">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      Delete
    </button>
  </div>

  <div class="flex-1 overflow-y-auto">
    <div *ngIf="!selectedElement" class="text-center py-12 px-4">
      <svg class="w-10 h-10 mx-auto text-slate-700 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <div class="text-xs text-slate-600">Select an element to edit</div>
    </div>

    <div *ngIf="selectedElement" class="p-3 space-y-3">
      <div>
        <label class="label-text">Name</label>
        <input class="input-field mt-1" [value]="selectedElement.name"
               (change)="updateProp('name', $any($event.target).value)">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="label-text">X (mm)</label>
          <input type="number" class="input-field mt-1" [value]="selectedElement.x"
                 (change)="updateNumberProp('x', $event)" step="0.5">
        </div>
        <div>
          <label class="label-text">Y (mm)</label>
          <input type="number" class="input-field mt-1" [value]="selectedElement.y"
                 (change)="updateNumberProp('y', $event)" step="0.5">
        </div>
        <div>
          <label class="label-text">Width (mm)</label>
          <input type="number" class="input-field mt-1" [value]="selectedElement.width"
                 (change)="updateNumberProp('width', $event)" step="0.5" min="1">
        </div>
        <div>
          <label class="label-text">Height (mm)</label>
          <input type="number" class="input-field mt-1" [value]="selectedElement.height"
                 (change)="updateNumberProp('height', $event)" step="0.5" min="1">
        </div>
      </div>

      <div>
        <label class="label-text">Rotation</label>
        <select class="select-field mt-1" [value]="selectedElement.orientation || 0"
                (change)="updateNumberProp('orientation', $event)">
          <option [value]="0">0</option>
          <option [value]="90">90</option>
          <option [value]="180">180</option>
          <option [value]="270">270</option>
        </select>
      </div>

      <div *ngIf="isText" class="space-y-2 border-t border-slate-700/50 pt-3">
        <div class="section-title">Text Settings</div>
        <div>
          <label class="label-text">Content</label>
          <textarea class="input-field mt-1" rows="2" [value]="selectedElement.text || ''"
                    (change)="updateProp('text', $any($event.target).value)"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="label-text">Font Size (mm)</label>
            <input type="number" class="input-field mt-1" [value]="selectedElement.fontHeight || 4"
                   (change)="updateNumberProp('fontHeight', $event)" step="0.5" min="1">
          </div>
          <div>
            <label class="label-text">Font Name</label>
            <input class="input-field mt-1" [value]="selectedElement.fontName || 'Arial'"
                   (change)="updateProp('fontName', $any($event.target).value)">
          </div>
        </div>
        <div>
          <label class="label-text">H-Align</label>
          <select class="select-field mt-1" [value]="selectedElement.horizontalAlignment || 0"
                  (change)="updateNumberProp('horizontalAlignment', $event)">
            <option [value]="0">Left</option>
            <option [value]="1">Center</option>
            <option [value]="2">Right</option>
            <option [value]="3">Stretch</option>
          </select>
        </div>
        <div>
          <label class="label-text">V-Align</label>
          <select class="select-field mt-1" [value]="selectedElement.verticalAlignment || 0"
                  (change)="updateNumberProp('verticalAlignment', $event)">
            <option [value]="0">Top</option>
            <option [value]="1">Middle</option>
            <option [value]="2">Bottom</option>
            <option [value]="3">Stretch</option>
          </select>
        </div>
      </div>

      <div *ngIf="isQRCode" class="space-y-2 border-t border-slate-700/50 pt-3">
        <div class="section-title">QR Code Settings</div>
        <div>
          <label class="label-text">Content</label>
          <textarea class="input-field mt-1" rows="2" [value]="selectedElement.text || ''"
                    (change)="updateProp('text', $any($event.target).value)"></textarea>
        </div>
        <div>
          <label class="label-text">Error Correction</label>
          <select class="select-field mt-1" [value]="selectedElement.eccLevel || 0"
                  (change)="updateNumberProp('eccLevel', $event)">
            <option [value]="0">L (7%)</option>
            <option [value]="1">M (15%)</option>
            <option [value]="2">Q (25%)</option>
            <option [value]="3">H (30%)</option>
          </select>
        </div>
      </div>

      <div *ngIf="isBarcode" class="space-y-2 border-t border-slate-700/50 pt-3">
        <div class="section-title">Barcode Settings</div>
        <div>
          <label class="label-text">Content</label>
          <input class="input-field mt-1" [value]="selectedElement.text || ''"
                 (change)="updateProp('text', $any($event.target).value)">
        </div>
        <div>
          <label class="label-text">Text Height (mm)</label>
          <input type="number" class="input-field mt-1" [value]="selectedElement.textHeight || 5"
                 (change)="updateNumberProp('textHeight', $event)" step="0.5" min="0">
        </div>
      </div>

      <div *ngIf="isImage" class="space-y-2 border-t border-slate-700/50 pt-3">
        <div class="section-title">Image Settings</div>
        <div>
          <label class="label-text">Image Source</label>
          <div class="flex items-center gap-2 mt-1">
            <!-- 原本的輸入框保留，讓使用者依然可以貼 URL，並加上 flex-1 讓它填滿剩餘空間 -->
            <input class="input-field flex-1" [value]="selectedElement.imageFile || ''"
                   (change)="updateProp('imageFile', $any($event.target).value)"
                   placeholder="URL or Upload ->">

            <!-- 隱藏的 File Input -->
            <input type="file" #fileUpload class="hidden" accept="image/png, image/jpeg, image/jpg, image/bmp"
                   (change)="onImageUpload($event)">

            <!-- 觸發上傳的按鈕 -->
            <button class="btn-secondary px-3 py-1.5" (click)="fileUpload.click()" title="Upload Local Image">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- (選配) 進階：因為是圖片，順便加上閾值(Threshold)的調整 -->
        <div class="mt-2">
          <label class="label-text">B&W Threshold (0-255)</label>
          <input type="number" class="input-field mt-1" [value]="selectedElement.threshold || 192"
                 (change)="updateNumberProp('threshold', $event)" min="0" max="255">
        </div>
      </div>

      <div *ngIf="isShape" class="space-y-2 border-t border-slate-700/50 pt-3">
        <div class="section-title">Shape Settings</div>
        <div>
          <label class="label-text">Line Width (mm)</label>
          <input type="number" class="input-field mt-1" [value]="selectedElement.lineWidth || 0.4"
                 (change)="updateNumberProp('lineWidth', $event)" step="0.1" min="0.1">
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" [checked]="selectedElement.fill || false"
                 (change)="updateFill($event)"
                 class="rounded border-slate-600 bg-slate-800 text-indigo-500 focus:ring-indigo-500/40">
          <label class="label-text">Fill</label>
        </div>
        <div *ngIf="isRectangle" class="grid grid-cols-2 gap-2">
          <div>
            <label class="label-text">Corner W</label>
            <input type="number" class="input-field mt-1" [value]="selectedElement.cornerWidth || 0"
                   (change)="updateNumberProp('cornerWidth', $event)" step="0.5" min="0">
          </div>
          <div>
            <label class="label-text">Corner H</label>
            <input type="number" class="input-field mt-1" [value]="selectedElement.cornerHeight || 0"
                   (change)="updateNumberProp('cornerHeight', $event)" step="0.5" min="0">
          </div>
        </div>
      </div>

      <div *ngIf="isLine" class="space-y-2 border-t border-slate-700/50 pt-3">
        <div class="section-title">Line Settings</div>
        <div>
          <label class="label-text">Line Width (mm)</label>
          <input type="number" class="input-field mt-1" [value]="selectedElement.lineWidth || 0.4"
                 (change)="updateNumberProp('lineWidth', $event)" step="0.1" min="0.1">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="label-text">X1</label>
            <input type="number" class="input-field mt-1" [value]="getX1()"
                   (change)="updateNumberProp('x1', $event)" step="0.5">
          </div>
          <div>
            <label class="label-text">Y1</label>
            <input type="number" class="input-field mt-1" [value]="getY1()"
                   (change)="updateNumberProp('y1', $event)" step="0.5">
          </div>
          <div>
            <label class="label-text">X2</label>
            <input type="number" class="input-field mt-1" [value]="getX2()"
                   (change)="updateNumberProp('x2', $event)" step="0.5">
          </div>
          <div>
            <label class="label-text">Y2</label>
            <input type="number" class="input-field mt-1" [value]="getY2()"
                   (change)="updateNumberProp('y2', $event)" step="0.5">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
